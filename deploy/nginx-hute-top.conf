# hute.top HTTPS（证书路径：/etc/nginx/ssl/hute.top/）
# 部署：node ../myweb_JAVA/scripts/deploy-ssl.cjs
#
# WebSocket：apiOrigin 为空时前端连 wss://$host/ws/fieldpulse，必须由本段穿透到 Java。

# ---- 可复用片段说明（三处 server 均已内联）----
# location /ws/ {
#     proxy_pass http://127.0.0.1:8787/ws/;
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection "Upgrade";
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_read_timeout 3600s;
#     proxy_send_timeout 3600s;
# }

server {
    listen 80;
    listen [::]:80;
    server_name hute.top www.hute.top;

    root /home/ubuntu/_deploy/three-city;
    index index.html index.htm;

    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8787/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

