# Nginx 反向代理（添加到站点 server {} 内）
# 将 /api/draw 转发到 Java Spring Boot（默认 8787；若 Java 用 8080 请改端口）

location /api/draw/ {
    proxy_pass http://127.0.0.1:8787/api/draw/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Draw-Role $http_x_draw_role;
    proxy_read_timeout 30s;
}

# 若 Java 统一提供 /api/cad、/api/v1 等，可合并为：
# location /api/ {
#     proxy_pass http://127.0.0.1:8787/api/;
#     ...
# }
